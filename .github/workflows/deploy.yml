name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/ai-os-frontend-demo-bguwxt]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue rather than cancel so a push always ships.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reports the site's base path. It fails while Pages is switched off for
      # the repository, which must not take the build down with it — only the
      # deploy job genuinely needs Pages to exist.
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Resolve base path
        id: base
        run: |
          path='${{ steps.pages.outputs.base_path }}'
          if [ -z "$path" ]; then
            # Same rule the action applies: a project site lives under /<repo>,
            # a <user>.github.io site at the root.
            case '${{ github.event.repository.name }}' in
              *.github.io) path='' ;;
              *) path='/${{ github.event.repository.name }}' ;;
            esac
          fi
          echo "path=${path}/" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
